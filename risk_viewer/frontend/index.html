<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2213%22>%F0%9F%8F%99%EF%B8%8F</text></svg>" />
    <title>City Risk Visor</title>
    <!-- Loaded directly, not just via main.ts's `import "./style.css"`,
         so the browser can start fetching/applying it in parallel with
         the JS module graph instead of only after main.ts finishes
         executing -- otherwise the page paints unstyled for a moment
         first (a flash of unstyled content), most visible in Vite dev
         mode where the module graph is many small separate requests
         rather than one bundle. Vite dedupes this against main.ts's own
         import in both dev and the production build. -->
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="map"></div>
      <button id="typology-metrics-toggle" type="button" class="icon-button hidden" aria-label="Structural typology model quality" title="Structural typology model quality">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="19" x2="5" y2="11" />
          <line x1="12" y1="19" x2="12" y2="5" />
          <line x1="19" y1="19" x2="19" y2="14" />
        </svg>
      </button>
      <button id="reorient-toggle" type="button" class="icon-button" aria-label="Reset map orientation" title="Reset map orientation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <polygon points="12,5 14,12 12,19 10,12" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button id="view-3d-toggle" type="button" class="icon-button" aria-label="Toggle 3D buildings" title="Toggle 3D buildings">3D</button>
      <button id="settings-toggle" type="button" class="icon-button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6" />
          <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="12" x2="20" y2="12" />
          <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
          <line x1="4" y1="18" x2="20" y2="18" />
          <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <aside id="typology-metrics-panel" class="glass-panel hidden">
        <div class="building-panel-actions">
          <button id="typology-metrics-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="typology-metrics-panel-content"></div>
      </aside>
      <aside id="settings-panel" class="glass-panel hidden">
        <div class="building-panel-actions">
          <button id="settings-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="settings-panel-content"></div>
      </aside>
      <aside id="controls" class="glass-panel">
        <button id="controls-toggle" type="button" aria-label="Collapse panel" title="Collapse panel">⟨</button>
        <div id="controls-body">
          <h1>City Risk Visor</h1>
          <p class="subtitle" id="mode-subtitle">Exposure &amp; typology</p>

          <label>Layer</label>
          <div id="mode-select" class="segmented">
            <button type="button" data-value="exposure" class="active">Exposure &amp; typology</button>
            <button type="button" data-value="risk">Seismic risk scenario</button>
          </div>

          <label>Color by</label>
          <div id="attribute-select"></div>

          <label>City</label>
          <div id="city-select"></div>

          <div id="scenario-panel" class="hidden"></div>

          <div id="legend"></div>
          <div id="typology-quality"></div>
          <p class="hint hidden" id="mode-hint"></p>
        </div>
      </aside>
      <aside id="building-panel" class="glass-panel hidden">
        <div class="building-panel-actions">
          <button id="building-panel-close" aria-label="Close">&times;</button>
        </div>
        <div id="building-panel-content"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
