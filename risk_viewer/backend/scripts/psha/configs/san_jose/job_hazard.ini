[general]
description = CRSHM2022 classical PSHA for San Jose (Hidalgo-Leiva et al. 2022, unmodified base model)
calculation_mode = classical
random_seed = 23

[geometry]
sites_csv = ../configs/san_jose/site.csv

[logic_tree]
number_of_logic_tree_samples = 0

[erf]
rupture_mesh_spacing = 5.0
width_of_mfd_bin = 0.1
area_source_discretization = 10.0
complex_fault_mesh_spacing = 10.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 760.0
reference_depth_to_1pt0km_per_sec = -999
reference_depth_to_2pt5km_per_sec = -999

[calculation]
source_model_logic_tree_file = Costa_Rica_UCR_UCREA_lt_v1.xml
gsim_logic_tree_file = Costa_Rica_UCR_UCREA_gmpe_v1.xml
investigation_time = 50.0
intensity_measure_types_and_levels = {"PGA": logscale(0.005, 8.0, 39), "SA(0.1)": logscale(0.005, 8.0, 39), "SA(0.2)": logscale(0.005, 8.0, 39), "SA(0.3)": logscale(0.005, 8.0, 39), "SA(0.4)": logscale(0.005, 8.0, 39), "SA(0.5)": logscale(0.005, 8.0, 39), "SA(0.6)": logscale(0.005, 8.0, 39), "SA(0.7)": logscale(0.005, 8.0, 39), "SA(0.8)": logscale(0.005, 8.0, 39), "SA(0.9)": logscale(0.005, 8.0, 39), "SA(1.0)": logscale(0.005, 8.0, 39), "SA(2.0)": logscale(0.005, 8.0, 39), "SA(3.0)": logscale(0.005, 8.0, 39)}
truncation_level = 5
maximum_distance = {'default': 300.}

[output]
export_dir = ./results
mean_hazard_curves = True
quantile_hazard_curves = 0.16 0.84
