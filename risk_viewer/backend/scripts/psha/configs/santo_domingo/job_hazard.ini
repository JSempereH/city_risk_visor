[general]
description = DOM source-model epistemic uncertainty, 16-sample logic tree
calculation_mode = classical
random_seed = 805

[geometry]
sites_csv = site.csv

[logic_tree]
number_of_logic_tree_samples = 16

[erf]
rupture_mesh_spacing = 2.0
width_of_mfd_bin = 0.1
area_source_discretization = 5.0
complex_fault_mesh_spacing = 10.0

[site_params]
reference_vs30_type = measured
reference_vs30_value = 800.0
reference_depth_to_2pt5km_per_sec = 5.0
reference_depth_to_1pt0km_per_sec = 100.0

[calculation]
source_model_logic_tree_file = ssmLT.xml
gsim_logic_tree_file = gmmLT.xml
investigation_time = 1.
intensity_measure_types_and_levels = {"PGA": logscale(0.005, 3.00, 20),
                                      "SA(0.1)": logscale(0.005, 4.00, 20),
                                      "SA(0.2)": logscale(0.005, 4.00, 20),
                                      "SA(0.5)": logscale(0.005, 3.00, 20),
                                      "SA(1.0)": logscale(0.005, 2.00, 20),
                                      "SA(2.0)": logscale(0.005, 2.00, 20)}
truncation_level = 3
maximum_distance = {'default': 300}

[output]
export_dir = ./results
mean_hazard_curves = true
quantile_hazard_curves = 0.16 0.84
